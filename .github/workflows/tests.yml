name: Run Tests

on:
  push:
    branches: [ "master", "tests" ]
  pull_request:
    branches: [ "master", "tests" ]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Install Linux Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zip pkg-config libgtk-3-dev libcurl4-openssl-dev libopenal-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev
      
    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DRUN_TESTS_POST_BUILD=OFF

    - name: Build Executable
      run: cmake --build ${{ github.workspace }}/build --target meckt-tests --config Release --parallel
        
    - name: Run meckt-tests (Linux)
      if: runner.os == 'Linux'
      run: ./build/bin/Release/meckt-tests

    - name: Run meckt-tests (Windows)
      if: runner.os == 'Windows'
      run: ./build/bin/Release/meckt-tests.exe