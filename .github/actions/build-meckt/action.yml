name: Build meckt
description: Build the test version of meckt.

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zip pkg-config libgtk-3-dev libcurl4-openssl-dev libopenal-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev libdw-dev libdwarf-dev

    - name: Configure CMake
      shell: bash
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DRUN_TESTS_POST_BUILD=OFF

    - name: Build Executable
      shell: bash
      run: cmake --build build --target meckt-tests --config Debug --parallel

    - name: Upload artefact
      uses: actions/upload-artifact@v7
      with:
        name: meckt-tests
        path: ${{ github.workspace }}/build/bin/meckt-tests
        if-no-files-found: error
        archive: false
        retention-days: 1
    